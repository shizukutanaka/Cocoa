name: Cocoa CI/CD Pipeline

on:
  push:
    # このリポジトリのデフォルトブランチは master。以前は main/develop のみを
    # 対象にしていたため、master への push/PR ではワークフローが一度も起動せず、
    # 「ブロッキングゲート」が実質無効だった。master を追加して実際に走らせる。
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  # コード品質チェックとテスト
  quality-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 3.11 matches docker/Dockerfile's base image (python:3.11-slim) --
    # previously this ran 3.9 here while the Dockerfile used 3.11 and
    # pyproject.toml targeted 3.8, so "tests passed in CI" didn't actually
    # confirm the version the app ships on.
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # requirements.txt pulls in torch/transformers/diffusers/web3/oqs/
    # pqcrystals/sklearn/sqlalchemy(pinned differently)/etc. for the ~60
    # main/ modules that are not reachable from either real entry point
    # (main/api_server.py, main/main.py) -- see FEATURE_AUDIT.md 4-1. None
    # of that is needed to run the test suite (every one of those imports is
    # already guarded with try/except in the modules that use them), and
    # installing it all made CI slow and occasionally fragile (several need
    # a C/Rust toolchain to build). requirements-ci.txt has just what the
    # reachable modules need to exercise their real code paths instead of
    # just the try/except fallback -- see that file's own header for exactly
    # how it was derived.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    # Non-blocking (informational): this repo has ~60 main/ modules with no
    # import path from either real entry point (FEATURE_AUDIT.md 4-1), and
    # their pylint health has never been triaged -- flipping this to
    # blocking today would fail CI on pre-existing, out-of-scope findings
    # rather than anything a given PR introduced. It's also not simply
    # "disable non-blocking findings": at least one E-category
    # (bad-except-order) finding in main/api_server.py is a false positive
    # from pylint not modeling the module's `except ImportError: AuthError =
    # Exception` fallback -- pylint sees that assignment and concludes
    # AuthError IS Exception, then flags a later `except ValueError` as
    # unreachable, which it is not at runtime. Fixing that properly needs a
    # per-finding pass across the full reachable set, not a blanket
    # unblock -- tracked as follow-up, not done here.
    - name: Lint with pylint (informational)
      run: |
        pylint main/ --disable=C,R,W0613,W0105 --output-format=text || true

    # Same reasoning as pylint: non-blocking until the reachable module set
    # has been triaged against strict typing.
    - name: Type checking with mypy (informational)
      run: |
        mypy main/ --ignore-missing-imports || true

    # Blocking gate: the 36 test files that correspond 1:1 to the 36 main/
    # modules actually reachable from api_server.py or main.py (same BFS
    # reachability FEATURE_AUDIT.md 4-1 used), PLUS the API auth regression
    # tests.
    #
    # This step used to run `python -m unittest tests.test_...`. That was a
    # silent hole: tests/test_api_auth_401_regression.py and
    # tests/test_api_auth_missing_header.py are written as bare `def test_*`
    # pytest functions, not unittest.TestCase subclasses, so unittest collected
    # ZERO tests from them and still exited 0 ("Ran 0 tests ... OK"). The 17
    # assertions guarding "unauthenticated request must get 401, not 500" --
    # the exact regression commit 4752c0d fixed -- had no CI coverage at all.
    # pytest collects both styles, so it is the correct runner here.
    - name: Run tests (reachable modules + auth regressions -- blocking)
      run: |
        python -m pytest -v --tb=short \
          tests/test_api_server.py tests/test_auth_manager.py tests/test_avatar_collections.py \
          tests/test_avatar_marketplace.py tests/test_bundle_manager.py tests/test_cache_manager.py \
          tests/test_cart_manager.py tests/test_commissions.py tests/test_config_validator.py \
          tests/test_csv_safety.py tests/test_database_manager.py tests/test_disaster_recovery.py \
          tests/test_gift_card_manager.py tests/test_grafana_integration.py tests/test_health_monitor.py \
          tests/test_i18n_manager.py tests/test_idempotency.py tests/test_integrated_security.py \
          tests/test_license_manager.py tests/test_main.py tests/test_membership_manager.py \
          tests/test_moderation_queue.py tests/test_pagination.py tests/test_performance_monitor.py \
          tests/test_prometheus_monitor.py tests/test_rate_limiter.py tests/test_redis_cache_manager.py \
          tests/test_referral_manager.py tests/test_refund_manager.py tests/test_saved_searches.py \
          tests/test_search_engine.py tests/test_two_factor_auth.py tests/test_user_notifications.py \
          tests/test_vrchat_parameter_budget.py tests/test_vrchat_performance_analyzer.py \
          tests/test_wishlist_manager.py \
          tests/test_api_auth_401_regression.py tests/test_api_auth_missing_header.py

    # Non-blocking (informational): the full suite including the test files
    # covering the ~60 unreachable/dead modules (FEATURE_AUDIT.md 4-1, 4-3).
    # Run with pytest for the same collection reason as above.
    - name: Run tests (full suite -- informational)
      continue-on-error: true
      run: |
        python -m pytest tests/ -q --tb=line

  # セキュリティスキャン
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Security scan with bandit
      run: |
        pip install bandit
        bandit -r main/ -f json -o bandit-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  # Dockerイメージビルド
  docker-build:
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          cocoa/avatar-management:latest
          cocoa/avatar-management:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # デプロイメント（開発環境）
  # NOTE: these are placeholder steps -- there is no real deployment target
  # (k8s manifests, hosting provider, etc.) configured for this project yet.
  # Left as an explicit no-op (rather than silently pretending to deploy) so
  # anyone reading pipeline output sees exactly what did and didn't happen.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
    - name: Deploy to development server (not yet configured)
      run: |
        echo "No deployment target configured for development yet -- this step is a placeholder."
        echo "Docker image cocoa/avatar-management:${{ github.sha }} was built and pushed; nothing deploys it."

  # デプロイメント（本番環境）
  deploy-prod:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Deploy to production server (not yet configured)
      run: |
        echo "No deployment target configured for production yet -- this step is a placeholder."
        echo "Docker image cocoa/avatar-management:${{ github.sha }} was built and pushed; nothing deploys it."

  # 通知
  notify:
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan]
    if: always()

    steps:
    - name: Notify deployment status
      run: |
        echo "Pipeline completed with status: ${{ job.status }}"
